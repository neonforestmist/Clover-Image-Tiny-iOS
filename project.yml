name: Clover

options:
  bundleIdPrefix: com.lukaslozada
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  StableDiffusion:
    path: Packages/ml-stable-diffusion

settings:
  base:
    DEVELOPMENT_TEAM: Z3GU26J2H4
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted

targets:
  Clover:
    type: application
    platform: iOS
    sources:
      - path: Clover
    dependencies:
      - package: StableDiffusion
        product: StableDiffusion
    info:
      path: Clover/Support/Info.plist
      properties:
        CFBundleDisplayName: Clover
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: Clover saves images you create to your photo library.
        UIFileSharingEnabled: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: 1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.lukaslozada.Clover
        PRODUCT_NAME: Clover
        TARGETED_DEVICE_FAMILY: "1,2"
  CloverTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CloverTests
    dependencies:
      - target: Clover
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.lukaslozada.CloverTests

  CloverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CloverUITests
    dependencies:
      - target: Clover
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.lukaslozada.CloverUITests
        TEST_TARGET_NAME: Clover

schemes:
  Clover:
    build:
      targets:
        Clover: all
        CloverTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CloverTests
        - CloverUITests
    archive:
      config: Release
